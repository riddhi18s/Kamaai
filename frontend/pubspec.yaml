name: kamaai
description: "Kamaai Flutter Application"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.3.0
  dio: ^5.10.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  pin_code_fields: ^8.0.1
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  permission_handler: ^12.0.3
  intl: ^0.20.2
  flutter_svg: ^2.2.1
  shared_preferences: ^2.5.5
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.5
  firebase_messaging: ^16.4.3
  firebase_analytics: ^12.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/